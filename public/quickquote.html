<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>QuickQuote - AI Agent + PayPal Edition</title>
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-50 min-h-screen py-10 px-4">
    <div class="max-w-xl mx-auto bg-white rounded-xl shadow-lg p-6 md:p-8">
        <h1 class="text-2xl font-bold text-slate-800 mb-1">⚡ QuickQuote AI</h1>
        <p class="text-slate-600 mb-6 text-sm">AI-powered instant quotations with integrated PayPal checkout.</p>

        <div class="bg-emerald-50 border border-emerald-200 rounded-xl p-4 mb-6">
            <label class="block text-xs font-semibold uppercase tracking-wider text-emerald-800 mb-1">🤖 AI Quote
                Agent</label>
            <p class="text-xs text-emerald-700 mb-2">Type your request naturally and let the AI agent fill the details
                for you!</p>
            <textarea id="aiPrompt" rows="2"
                placeholder="e.g. Create a quote for Isaac for 3 catering plates at 15000 naira each"
                class="w-full p-2.5 text-sm rounded-lg border border-emerald-300 focus:ring-2 focus:ring-emerald-500 outline-none bg-white"></textarea>
            <button onclick="runAIAgent()" id="aiBtn"
                class="mt-2 w-full bg-emerald-700 text-white text-sm font-semibold py-2 rounded-lg hover:bg-emerald-800 transition flex items-center justify-center gap-2">
                <span>🤖 Ask AI Agent to Fill Quote</span>
            </button>
        </div>

        <div class="space-y-4 border-t pt-4 border-slate-200">
            <h2 class="text-xs font-semibold text-slate-400 uppercase tracking-wider">Or Edit Details Manually</h2>
            <div>
                <label class="block text-sm font-medium text-slate-700 mb-1">Client Name / Business</label>
                <input type="text" id="clientName" placeholder="e.g. Mama Chidi Catering"
                    class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
            </div>

            <div class="grid grid-cols-1 md:grid-cols-3 gap-3">
                <div class="md:col-span-1">
                    <label class="block text-sm font-medium text-slate-700 mb-1">Service Item</label>
                    <input type="text" id="serviceName" placeholder="e.g. Logo Design"
                        class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Qty</label>
                    <input type="number" id="quantity" value="1" min="1"
                        class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
                <div>
                    <label class="block text-sm font-medium text-slate-700 mb-1">Price (₦)</label>
                    <input type="number" id="price" placeholder="15000"
                        class="w-full px-3 py-2 border rounded-lg focus:ring-2 focus:ring-emerald-500 outline-none">
                </div>
            </div>

            <button onclick="generateQuote()"
                class="w-full bg-slate-800 text-white font-semibold py-2.5 rounded-lg hover:bg-slate-900 transition">
                Generate Quote & Payment Button
            </button>
        </div>

        <div id="outputSection" class="mt-8 hidden">
            <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-2">WhatsApp Preview</h2>
            <div id="quotePreview"
                class="bg-slate-100 p-4 rounded-lg font-mono text-sm text-slate-800 whitespace-pre-line border"></div>

            <button onclick="copyToClipboard()"
                class="mt-3 w-full bg-emerald-600 text-white font-semibold py-2 rounded-lg hover:bg-emerald-700 transition flex items-center justify-center gap-2">
                📋 Copy WhatsApp Message
            </button>
            <p id="copyAlert" class="text-xs text-emerald-600 text-center mt-2 hidden font-medium">Copied to clipboard
                successfully!</p>

            <div class="mt-6 pt-4 border-t border-slate-200">
                <h2 class="text-sm font-semibold text-slate-500 uppercase tracking-wider mb-3">Instant Checkout (PayPal
                    Sandbox)</h2>
                <div id="paypal-button-container"></div>
                <p id="paymentStatus" class="mt-3 text-sm font-medium text-center"></p>
            </div>
        </div>
    </div>

    <script>
        // ---------- PayPal: load the SDK using the Client ID from our server ----------
        let paypalLoading = null;
        function loadPayPal() {
            if (paypalLoading) return paypalLoading;
            paypalLoading = fetch('/api/config')
                .then(r => r.json())
                .then(cfg => new Promise((resolve, reject) => {
                    if (!cfg.paypalClientId) {
                        reject(new Error('PAYPAL_CLIENT_ID is missing in .env'));
                        return;
                    }
                    const s = document.createElement('script');
                    s.src = 'https://www.paypal.com/sdk/js?client-id=' +
                        encodeURIComponent(cfg.paypalClientId) + '&currency=USD';
                    s.onload = resolve;
                    s.onerror = () => reject(new Error('Could not load the PayPal script'));
                    document.head.appendChild(s);
                }));
            return paypalLoading;
        }

        function setStatus(text, isError) {
            const el = document.getElementById('paymentStatus');
            el.innerText = text;
            el.className = 'mt-3 text-sm font-medium text-center ' +
                (isError ? 'text-red-600' : 'text-emerald-700');
        }

        let paypalRendered = false;
        async function renderPayPal() {
            if (paypalRendered) return;
            paypalRendered = true;
            try {
                await loadPayPal();
                paypal.Buttons({
                    // Our SERVER creates the order using the current quote details
                    createOrder: async function () {
                        setStatus('', false);
                        const res = await fetch('/api/orders', {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                client: document.getElementById('clientName').value.trim(),
                                service: document.getElementById('serviceName').value.trim(),
                                quantity: document.getElementById('quantity').value,
                                price: document.getElementById('price').value
                            })
                        });
                        const order = await res.json();
                        if (!order.id) {
                            throw new Error((order.error && order.error.message) || 'Could not create order');
                        }
                        return order.id;
                    },
                    // Our SERVER captures (completes) the payment
                    onApprove: async function (data) {
                        const res = await fetch('/api/orders/' + data.orderID + '/capture', { method: 'POST' });
                        const result = await res.json();
                        if (result.status === 'COMPLETED') {
                            const cap = result.purchase_units[0].payments.captures[0];
                            const name = (result.payer && result.payer.name && result.payer.name.given_name) || 'customer';
                            setStatus('✅ Payment of $' + cap.amount.value + ' ' + cap.amount.currency_code +
                                ' completed by ' + name + '. Transaction ID: ' + cap.id, false);
                        } else {
                            setStatus('Payment not completed: ' + (result.status || 'unknown error'), true);
                        }
                    },
                    onError: function (err) {
                        console.error(err);
                        setStatus('Payment error: ' + err.message, true);
                    }
                }).render('#paypal-button-container');
            } catch (err) {
                paypalRendered = false;
                paypalLoading = null;
                setStatus('PayPal error: ' + err.message, true);
            }
        }

        // ---------- AI Agent: talks to OUR server, which holds the key safely ----------
        async function runAIAgent() {
            const promptInput = document.getElementById('aiPrompt').value.trim();
            const btn = document.getElementById('aiBtn');
            if (!promptInput) {
                alert('Please type a quote request into the AI box first!');
                return;
            }

            btn.disabled = true;
            btn.innerText = '⏳ AI Agent is thinking...';

            try {
                const response = await fetch('/api/quote', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ prompt: promptInput })
                });

                const data = await response.json();

                if (data.error) {
                    alert('API Error: ' + (data.error.message || JSON.stringify(data.error)));
                    return;
                }

                const contentText = data.choices[0].message.content.trim();
                const match = contentText.match(/\{[\s\S]*\}/);
                if (!match) throw new Error('Model did not return JSON: ' + contentText);
                const result = JSON.parse(match[0]);

                if (result.clientName) document.getElementById('clientName').value = result.clientName;
                if (result.serviceName) document.getElementById('serviceName').value = result.serviceName;
                if (result.quantity) document.getElementById('quantity').value = parseInt(result.quantity) || 1;
                if (result.price) {
                    document.getElementById('price').value = Number(String(result.price).replace(/[^\d.]/g, ''));
                }

                generateQuote();

            } catch (error) {
                console.error('AI Error:', error);
                alert('AI Agent error: ' + error.message);
            } finally {
                btn.disabled = false;
                btn.innerText = '🤖 Ask AI Agent to Fill Quote';
            }
        }

        function generateQuote() {
            const client = document.getElementById('clientName').value.trim() || 'Valued Client';
            const service = document.getElementById('serviceName').value.trim() || 'General Service';
            const qty = parseInt(document.getElementById('quantity').value) || 1;
            const price = parseFloat(document.getElementById('price').value) || 0;
            const total = qty * price;

            const message = `Hello ${client},\n\nHere is your requested quotation:\n\n*Service:* ${service}\n*Quantity:* ${qty}\n*Unit Price:* ₦${price.toLocaleString()}\n*Total:* ₦${total.toLocaleString()}\n\nThank you for your patronage!`;

            document.getElementById('quotePreview').innerText = message;
            document.getElementById('outputSection').classList.remove('hidden');
            document.getElementById('copyAlert').classList.add('hidden');
            renderPayPal();
        }

        function copyToClipboard() {
            const text = document.getElementById('quotePreview').innerText;
            navigator.clipboard.writeText(text);
            const note = document.getElementById('copyAlert');
            note.classList.remove('hidden');
            setTimeout(() => note.classList.add('hidden'), 3000);
        }
    </script>
</body>

</html>
